name: Attendance presence scheduler
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions:
  id-token: write
concurrency:
  group: attendance-presence
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check due attendance meetings
        shell: bash
        run: |
          set -euo pipefail
          audience='https://crm-cy-nu.vercel.app/api/cron/attendance-presence'
          token=$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -er '.value')
          echo "::add-mask::$token"
          curl --fail --silent --show-error --max-time 300 -H "Authorization: Bearer $token" "$audience"
